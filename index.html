<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090312">
<title>Varun • Millie • My World</title>
<style>
html,body{margin:0;min-height:100%;background:#090312;color:#fff;font-family:system-ui,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}h1{font-size:clamp(3rem,10vw,7rem);margin:0;background:linear-gradient(120deg,#fff,#62ecff,#ff4fd8,#ffd467);color:transparent;-webkit-background-clip:text;background-clip:text}p{color:#d5c4e2}
</style>
<div id="loading"><div><h1>VARUN × MILLIE</h1><p>Loading my world…</p></div></div>
<script>
(async()=>{try{const files=['site/micro1.txt','site/micro2.txt','site/micro3.txt','site/micro4.txt'];const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`${f}: ${r.status}`);return r.text()})));document.open();document.write(parts.join(''));document.close()}catch(e){document.getElementById('loading').innerHTML='<div><h1>Could not load the site</h1><p>'+String(e)+'</p></div>'}})();
</script>
